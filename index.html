<!-- CpeUnlock Logo (SVG) -->
<svg width="200" height="40" viewBox="0 0 200 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c5cff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon: Hexagon with unlock symbol -->
  <g transform="translate(5, 5)">
    <!-- Hexagon shape -->
    <polygon points="15,0 28,7 28,21 15,28 2,21 2,7" 
             fill="none" 
             stroke="url(#logoGrad)" 
             stroke-width="2.5" 
             stroke-linejoin="round"/>
    <!-- Unlock symbol (open padlock) -->
    <rect x="9" y="13" width="12" height="9" rx="1.5" 
          fill="url(#logoGrad)" opacity="0.9"/>
    <path d="M 11 13 L 11 9 Q 11 5 15 5 Q 18 5 19 8" 
          fill="none" 
          stroke="url(#logoGrad)" 
          stroke-width="2" 
          stroke-linecap="round"/>
    <!-- Keyhole dot -->
    <circle cx="15" cy="17" r="1.5" fill="#0a0a0f"/>
  </g>
  
  <!-- Text: CpeUnlock -->
  <text x="45" y="26" 
        font-family="Inter, -apple-system, sans-serif" 
        font-size="20" 
        font-weight="700" 
        fill="#e8e8f0" 
        letter-spacing="-0.5">
    Cpe<tspan fill="url(#logoGrad)">Unlock</tspan>
  </text>
</svg>
